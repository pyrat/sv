# Optional experimental override for depthpilot-rope.service.
# Install as /etc/systemd/system/depthpilot-rope.service.d/broadcast-start.conf
[Service]
ExecStart=
ExecStart=/opt/depthpilot-rope/depthpilot-rope -simulate=false -broadcast-start -listen :8080 -port /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
